variables:
  TAG_PARTITION: PILA Thailand
  ADMIN_TAG: [ 36e1b060-ed49-11ee-be89-5b04faf266ea ]
  TREATMENT_TAG_SET: [ 472a84d0-ab69-11f0-b8c9-a1d0807d9f84 ]
  CONTROL_TAG_SET: [ 41ad5640-ab69-11f0-b8c9-a1d0807d9f84 ]
  TEACHER_TAG_SET: [ 49bf66a0-ed49-11ee-be89-5b04faf266ea ]
  ADMIN_CONTENT_TAG_SET: [ ed58ea00-7629-11f1-bfa2-b1dfd57e5efd ]
authorize:
  sameDomain:
    postgres: same_domain_authorization
  crossDomain:
    postgres: cross_domain_authorization
postgres:
  tables:
    role_requests:
      type: application/json;type=role_request
      columns:
        role: TEXT
        trainer: TEXT
    role_assertions:
      type: application/json;type=role_assertion
      columns:
        role: TEXT
        assignee: TEXT
    studies:
      type: application/json;type=study
      columns: {}
    assignments:
      type: application/json;type=assignment
      columns:
        group_id: TEXT
        item_id: TEXT
        assignment_type: TEXT
        archived: BOOLEAN
    admin_teacher_assignments:
      type: application/json;type=admin_teacher_assignment
      columns:
        teacher_id: TEXT
        content_id: TEXT
        starts_at: TIMESTAMP
        ends_at: TIMESTAMP
        archived: BOOLEAN
      indices:
        admin_teacher_assignments_teacher_id:
          column: teacher_id
        admin_teacher_assignments_content_id:
          column: content_id
    groups:
      type: application/json;type=group
      columns:
        name: TEXT
        group_type: TEXT
        archived: BOOLEAN
    group_members:
      type: application/json;type=group_member
      columns:
        user_id: TEXT
        group_id: TEXT
        archived: BOOLEAN
    assignment_scopes:
      type: application/json;type=assignment_scope
      columns:
        scope: TEXT
        assignment: TEXT
    pila_sessions:
      type: application/json;type=pila_sessions
      columns:
        start: BIGINT
        ping: BIGINT
    pila_tags:
      type: application/json;type=pila_tag
      columns:
        content_id: TEXT
        tag_type: TEXT
        archived: BOOLEAN
    translation_targets:
      type: application/json;type=translation_target
      columns:
        target: TEXT
        path: TEXT[]
  functions:
    same_domain_authorization:
      returns: BOOLEAN
      language: PLpgSQL
      body: |
        BEGIN
          RETURN TRUE;
        END;
      arguments:
      - name: requestingUser
        type: TEXT
      - name: requestedScope
        type: TEXT
    cross_domain_authorization:
      returns: BOOLEAN
      language: PLpgSQL
      body: |
        BEGIN
          RETURN TRUE;
        END;
      arguments:
      - name: requestingDomain
        type: TEXT
      - name: requestingUser
        type: TEXT
      - name: requestedScope
        type: TEXT
    hasAdminTag:
      returns: BOOLEAN
      arguments:
      - name: content_id
        type: TEXT
      - name: tag_type
        type: TEXT
      - name: admin_ids
        type: TEXT[]
      language: PLpgSQL
      body: |
        BEGIN
          RETURN EXISTS (
            WITH cte AS (
              SELECT DISTINCT ON (t.content_id)
                md.owner as user_id,
                t.content_id,
                t.archived,
                md.updated
              FROM pila_tags t
              LEFT JOIN metadata md ON md.id = t.id
              WHERE t.content_id = hasAdminTag.content_id
                AND md.owner IN (SELECT unnest(hasAdminTag.admin_ids))
                AND t.tag_type = hasAdminTag.tag_type
              ORDER BY t.content_id, md.updated DESC
              LIMIT 1
            )
            SELECT 1
            FROM cte
            WHERE NOT cte.archived
          );
        END;
    role_assignments:
      returns:
        assignee: TEXT
        role: TEXT
        assigner: TEXT
        updated: TIMESTAMP
      arguments:
      - name: requester_id
        type: TEXT
      - name: admin_ids
        type: TEXT[]
      language: PLpgSQL
      body: |
        BEGIN
          RETURN QUERY
            SELECT
              ra.assignee,
              ra.role,
              m.owner as assigner,
              m.updated
            FROM role_assertions ra
            LEFT JOIN metadata m
              ON ra.id = m.id
            WHERE
              (ra.assignee, m.updated) IN (
                SELECT ra2.assignee, MAX(m2.updated)
                FROM role_assertions ra2
                LEFT JOIN metadata m2 ON ra2.id = m2.id
                WHERE m2.owner IN (SELECT unnest(role_assignments.admin_ids))
                GROUP BY ra2.assignee
              )
              AND m.owner IN (SELECT unnest(role_assignments.admin_ids))
              AND (
                requester_id IN (SELECT unnest(role_assignments.admin_ids))
                OR ra.assignee = requester_id
              )
              AND NOT ra.assignee IN (SELECT unnest(role_assignments.admin_ids))
            UNION
              SELECT unnest(role_assignments.admin_ids), 'admin', 'f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f', NULL
          ;
        END;
    latest_admin_teacher_assignments:
      returns:
        id: TEXT
        teacher_id: TEXT
        content_id: TEXT
        starts_at: TIMESTAMP
        ends_at: TIMESTAMP
        archived: BOOLEAN
        assigned_by: TEXT
        updated: TIMESTAMP
      arguments:
      - name: admin_ids
        type: TEXT[]
      - name: filter_teacher_id
        type: TEXT
      - name: filter_content_id
        type: TEXT
      language: PLpgSQL
      body: |
        BEGIN
          RETURN QUERY
            WITH ranked_assignments AS (
              SELECT
                ata.id,
                ata.teacher_id,
                ata.content_id,
                ata.starts_at,
                ata.ends_at,
                ata.archived,
                m.owner AS assigned_by,
                m.updated,
                ROW_NUMBER() OVER (
                  PARTITION BY ata.teacher_id, ata.content_id
                  ORDER BY m.updated DESC NULLS LAST, m.id DESC
                ) AS assignment_rank
              FROM admin_teacher_assignments ata
              JOIN metadata m ON m.id = ata.id
              WHERE m.owner = ANY(COALESCE(
                latest_admin_teacher_assignments.admin_ids,
                ARRAY[]::TEXT[]
              ))
                AND (
                  latest_admin_teacher_assignments.filter_teacher_id IS NULL
                  OR ata.teacher_id = latest_admin_teacher_assignments.filter_teacher_id
                )
                AND (
                  latest_admin_teacher_assignments.filter_content_id IS NULL
                  OR ata.content_id = latest_admin_teacher_assignments.filter_content_id
                )
            )
            SELECT
              ranked.id,
              ranked.teacher_id,
              ranked.content_id,
              ranked.starts_at,
              ranked.ends_at,
              ranked.archived,
              ranked.assigned_by,
              ranked.updated
            FROM ranked_assignments ranked
            WHERE ranked.assignment_rank = 1
          ;
        END;
  queries:
    admin_ids:
      external:
        admins_from_tags:
          domain: tags.knowlearning.systems
          query: taggings-intersection
          params:
          - $TAG_PARTITION
          - $ADMIN_TAG
      body: |
        SELECT DISTINCT value
        FROM (
          SELECT unnest(ARRAY[
            'f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f',
            '0c9c64fc-559e-40d4-916b-852f6d108a17',
            '25de1f29-28b4-44bd-9942-9f60f1f92447',
            '4e42c0c7-fe07-4199-b202-bdfe5fd3d975',
            'c29368a6-e239-4ab0-8e54-3ea6dc6e1b7b',
            'aabc6c9c-a4f8-405b-9de3-76588997d52f',
            'c0f3a481-d4d5-4133-a198-94a325aa4536'
          ]::TEXT[]) AS value
          UNION
          SELECT unnest($admins_from_tags::TEXT[]) AS value
        ) admin_ids
    role-assignments: SELECT * FROM role_assignments($REQUESTER, $admin_ids::TEXT[])
    admin-assigned-to-me:
      external:
        active_admin_content_ids:
          domain: tags.knowlearning.systems
          query: taggings-intersection
          params:
          - $TAG_PARTITION
          - $ADMIN_CONTENT_TAG_SET
      body: |
        SELECT latest.*
        FROM latest_admin_teacher_assignments(
          $admin_ids::TEXT[],
          $REQUESTER,
          NULL::TEXT
        ) latest
        WHERE latest.teacher_id = $REQUESTER
          AND latest.content_id = ANY(COALESCE(
            $active_admin_content_ids::TEXT[],
            ARRAY[]::TEXT[]
          ))
          AND latest.archived IS FALSE
          AND (
            latest.starts_at IS NULL
            OR latest.starts_at <= (CURRENT_TIMESTAMP AT TIME ZONE 'UTC')
          )
          AND (
            latest.ends_at IS NULL
            OR latest.ends_at > (CURRENT_TIMESTAMP AT TIME ZONE 'UTC')
          )
    admin-assignments-for-content: |
      SELECT latest.*
      FROM latest_admin_teacher_assignments(
        $admin_ids::TEXT[],
        NULL::TEXT,
        $1
      ) latest
      WHERE $REQUESTER = ANY(COALESCE($admin_ids::TEXT[], ARRAY[]::TEXT[]))
        AND latest.content_id = $1
    is-teacher:
      external:
        teacher_ids:
          domain: tags.knowlearning.systems
          query: taggings-intersection
          params:
          - $TAG_PARTITION
          - $TEACHER_TAG_SET
      domains:
        - thaipilacreate.gforcesolution.com
        - thaipilacreate.eef.or.th
      body: |
        SELECT (
          $REQUESTER = ANY(COALESCE($teacher_ids::TEXT[], ARRAY[]::TEXT[]))
          OR
          $REQUESTER = ANY(COALESCE($admin_ids::TEXT[], ARRAY[]::TEXT[]))
        ) AS value
    requested-roles: |
      SELECT
        role_requests.role AS role,
        role_requests.trainer AS trainer,
        metadata.owner     AS assignee,
        metadata.updated   AS updated
      FROM role_requests
      LEFT JOIN metadata
        ON metadata.id = role_requests.id
      WHERE $REQUESTER = ANY($admin_ids::TEXT[])
        OR metadata.owner = $REQUESTER
        OR role_requests.trainer = $REQUESTER
    # all groups a user owns, or has been put in
    groups: |
      SELECT
          groups.name,
          groups.group_type,
          groups.archived,
          metadata.owner as owner,
          metadata.id as id
      FROM groups
      LEFT JOIN metadata ON groups.id = metadata.id
      WHERE metadata.owner = $REQUESTER

      UNION

      SELECT
          groups.name,
          groups.group_type,
          groups.archived,
          metadata.owner as owner,
          metadata.id as id
      FROM groups
      LEFT JOIN metadata ON groups.id = metadata.id
      JOIN group_members ON groups.id = group_members.group_id
      WHERE group_members.user_id = $REQUESTER
    group_members: |
      SELECT
          gm.group_id,
          gm.user_id,
          gm.archived,
          m.id AS id
      FROM group_members gm
      LEFT JOIN metadata m ON gm.id = m.id
      WHERE gm.user_id = $REQUESTER

      UNION

      SELECT
          gm.group_id,
          gm.user_id,
          gm.archived,
          m.id AS id
      FROM group_members gm
      JOIN metadata m ON gm.id = m.id
      WHERE m.owner = $REQUESTER
    assignments: |
      SELECT
        assignments.id,
        assignments.item_id,
        assignments.group_id,
        assignments.assignment_type,
        assignments.archived,
        am.owner AS assigner_id
      FROM assignments
      LEFT JOIN metadata am ON am.id = assignments.id
      WHERE am.owner = $REQUESTER
        OR (
          assignments.item_id IN (
            SELECT item_id
            FROM assignments
            WHERE group_id IN (
              SELECT group_id
              FROM group_members
              WHERE user_id = $REQUESTER
            )
          )
          AND (
            assignments.assignment_type = 'teacher-to-student'
            OR
            assignments.assignment_type = 'teacher-to-student-research'
            OR (
              assignments.assignment_type = 'researcher-to-teacher'
              AND (
                assignments.item_id IS NOT NULL
                AND hasAdminTag(assignments.item_id, 'admin-approved'::text, $admin_ids::TEXT[])
              )
            )
          )
        )
    student-teacher-class-ids:
      domains:
      - export.knowlearning.systems
      - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:5656
      external:
        all_teachers:
          domain: tags.knowlearning.systems
          query: taggings-intersection
          params:
             - $TAG_PARTITION
             - $TEACHER_TAG_SET
        treatment_teacher_ids:
          domain: tags.knowlearning.systems
          query: taggings-intersection
          params:
          - $TAG_PARTITION
          - $TREATMENT_TAG_SET
        control_teacher_ids:
          domain: tags.knowlearning.systems
          query: taggings-intersection
          params:
          - $TAG_PARTITION
          - $CONTROL_TAG_SET
      body: |
        WITH grouped_students AS (
          SELECT DISTINCT
            md.owner AS teacher_id,
            gm.user_id AS student_id,
            gm.group_id AS class_id,
            COALESCE(groups.archived, FALSE) AS class_archived,
            CASE
              WHEN COALESCE(gm.archived, FALSE) THEN md.updated
              ELSE md.created
            END AS timestamp,
            COALESCE(gm.archived, FALSE) AS member_removed
          FROM group_members gm
          LEFT JOIN metadata md ON md.id = gm.id
          LEFT JOIN groups ON groups.id = gm.group_id
        )
        SELECT DISTINCT
          COALESCE(grouped_students.student_id, '') AS student_id,
          teachers.teacher_id,
          COALESCE(grouped_students.class_id, '') AS class_id,
          COALESCE(grouped_students.class_archived, FALSE) AS class_archived,
          grouped_students.timestamp,
          COALESCE(grouped_students.member_removed, FALSE) AS member_removed,
          teachers.teacher_id = ANY(COALESCE($treatment_teacher_ids::TEXT[], ARRAY[]::TEXT[])) AS treatment,
          teachers.teacher_id = ANY(COALESCE($control_teacher_ids::TEXT[], ARRAY[]::TEXT[])) AS control
        FROM UNNEST(COALESCE($all_teachers::TEXT[], ARRAY[]::TEXT[])) AS teachers(teacher_id)
        LEFT JOIN grouped_students ON grouped_students.teacher_id = teachers.teacher_id
    assignment-report: |
      SELECT
        COUNT(assignments.id) as "num-groups-assigned",
        am.owner AS "assigner-id"
      FROM assignments
      LEFT JOIN metadata am ON am.id = assignments.id
      GROUP BY am.owner
    login-report: |
      SELECT
        owner AS user,
        COUNT(*) AS "num-logins",
        SUM((ping - start) / 1000) AS "total-time-seconds"
      FROM pila_sessions
      LEFT JOIN metadata ON metadata.id = pila_sessions.id
      GROUP BY owner
    pila_tags: |
      SELECT
        pila_tags.id as id,
        md.owner as user_id,
        content_id,
        tag_type,
        archived,
        updated
      FROM pila_tags
      LEFT JOIN metadata md ON md.id = pila_tags.id
      WHERE
        (md.owner = $REQUESTER AND tag_type != 'expert')
        OR
        (
          tag_type = 'admin-approval-request'
          AND
          $REQUESTER = ANY($admin_ids::TEXT[])
        )
      UNION
      SELECT DISTINCT ON (content_id)
        pila_tags.id as id,
        md.owner as user_id,
        content_id,
        tag_type,
        archived,
        updated
      FROM pila_tags
      LEFT JOIN metadata md ON md.id = pila_tags.id
      WHERE md.owner = ANY($admin_ids::TEXT[])
        AND tag_type = 'expert'
      ORDER BY content_id, updated DESC
    mutated-in-context: |
      SELECT DISTINCT
        context,
        target,
        metadata.owner
      FROM tags
      LEFT JOIN metadata on metadata.id = tags.id
      WHERE
        $1 = ANY(context)
        AND tag_type = 'mutated'
agent: |
  import Agent, { getAgent } from 'npm:@knowlearning/agents/deno.js'

  const TagAgent = getAgent('tags.knowlearning.systems')

  const agentTags = await TagAgent.state('tags')

  function addTag(tagId, contentId) {
    if (!agentTags.value[tagId]) agentTags.value[tagId] = {}
    agentTags.value[tagId][contentId] = true
  }

  Agent.on('child', child => {
    const { environment: { user } } = child

    child.on('mutate', ({ scope, patch }) => {
      if (scope === 'tags') {
        patch.forEach(async ({ path, value:patchValue }) => {
          if (path.length === 2) {
            const [ tagId, contentId ] = path
            const { value, partition=user } = patchValue
            if (!agentTags[tagId]) agentTags[tagId] = {}
            agentTags[tagId][contentId] = { contributor: user, partition, value }
          }
        })
      }
    })
  })

  const xApiAgent = getAgent('xapi.knowlearning.systems')
  Agent.on('child', child => {
      const { environment: { user } } = child
      child.on('mutate', ({ id, scope, patch, context }) => {
          patch.forEach(async ({ path, value }) => {
            if (path[0] === 'xapi' && path.length === 1 && value) {
              const x = await xApiAgent.state(`xapi/${Agent.uuid()}`)
              Object.assign(x, {
                  ...value,
                  source: id,
                  context
              })
            }
          })
      })
  })
